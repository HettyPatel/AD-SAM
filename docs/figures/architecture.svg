<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 600" width="1370" height="600" color="#222">
<rect width="1370" height="600" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
  </marker>
</defs>
<g font-family="Georgia, 'Times New Roman', serif" stroke-width="1.4">

<!-- input -->
<rect x="22" y="215" width="130" height="130" rx="4" fill="#dcdcdc" stroke="#777"/>
<rect x="22" y="215" width="130" height="62" fill="#b9c9dd"/>
<rect x="22" y="277" width="130" height="68" fill="#8f8f8f"/>
<path d="M22,345 L152,345 L110,290 L64,290 z" fill="#6f6f6f"/>
<text x="87" y="372" text-anchor="middle" font-size="13" font-weight="normal" fill="currentColor">Input image</text>
<text x="87" y="388" text-anchor="middle" font-size="11.5" font-weight="normal" fill="currentColor">1024×1024×3</text>
<path d="M152,280 H190 V150 H210" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
<path d="M190,280 V395 H210" fill="none" stroke="currentColor" marker-end="url(#arr)"/>

<!-- SAM -->
<rect x="210" y="95" width="240" height="110" rx="4" fill="#cfdcf7" stroke="#6b83b8"/>
<text x="330" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SAM ViT-H encoder (frozen)</text>
<text x="330" y="148" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">637M params · never updated</text>
<text x="330" y="168" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">256 ch · 64×64 (stride 16)</text>
<text x="330" y="190" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">embeddings pre-computed once per image</text>

<!-- ResNet -->
<rect x="210" y="255" width="350" height="250" rx="4" fill="#d5e8cf" stroke="#6f9a63"/>
<text x="385" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ResNet-50 encoder (trainable)</text>
<text x="385" y="292" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">0.1× learning rate · BatchNorm statistics frozen · 23.5M params</text>
<rect x="225" y="302" width="66" height="180" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
<text x="250.0" y="356.0" transform="rotate(90 250.0 356.0)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">Layer 1</text>
<text x="268.0" y="431.6" transform="rotate(90 268.0 431.6)" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">256 ch · 256×256</text>
<rect x="305" y="302" width="66" height="180" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
<text x="330.0" y="356.0" transform="rotate(90 330.0 356.0)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">Layer 2</text>
<text x="348.0" y="431.6" transform="rotate(90 348.0 431.6)" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">512 ch · 128×128</text>
<rect x="385" y="302" width="66" height="180" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
<text x="410.0" y="356.0" transform="rotate(90 410.0 356.0)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">Layer 3</text>
<text x="428.0" y="431.6" transform="rotate(90 428.0 431.6)" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">1024 ch · 64×64</text>
<rect x="465" y="302" width="66" height="180" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
<text x="490.0" y="356.0" transform="rotate(90 490.0 356.0)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">Layer 4</text>
<text x="508.0" y="431.6" transform="rotate(90 508.0 431.6)" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">2048 ch · 32×32</text>

<!-- layer4 -> concat -->
<path d="M498,302 V240 H598" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
<text x="592" y="231" text-anchor="end" font-size="10.5" font-weight="normal" fill="currentColor">↑2× bilinear · 1×1 conv 2048→256</text>
<!-- SAM -> concat -->
<path d="M450,150 H610 V228" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
<circle cx="610" cy="240" r="11" fill="none" stroke="currentColor"/>
<path d="M603,240 H617 M610,233 V247" stroke="currentColor"/>
<text x="610" y="268" text-anchor="middle" font-size="11" font-weight="normal" fill="currentColor">concat</text>
<text x="610" y="282" text-anchor="middle" font-size="10.5" font-weight="normal" fill="currentColor">512 ch</text>
<path d="M621,240 H640" fill="none" stroke="currentColor" marker-end="url(#arr)"/>

<!-- fusion -->
<rect x="642" y="95" width="104" height="410" rx="4" fill="#f6b26b" stroke="#b7742a"/>
<text x="664.0" y="292" transform="rotate(90 664.0 292)" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Deformable feature fusion</text>
<text x="688.0" y="292" transform="rotate(90 688.0 292)" text-anchor="middle" font-size="11" font-weight="normal" fill="#222">concat → deformable conv 3×3 → GroupNorm</text>
<text x="704.0" y="292" transform="rotate(90 704.0 292)" text-anchor="middle" font-size="11" font-weight="normal" fill="#222">→ channel attention (SE) → GELU</text>
<text x="726.0" y="292" transform="rotate(90 726.0 292)" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">out: 256 ch · 64×64</text>
<text x="694.0" y="495" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#3a2a10">1.8M params</text>
<path d="M746,240 H774" fill="none" stroke="currentColor" marker-end="url(#arr)"/>

<!-- decoder -->
<rect x="776" y="95" width="248" height="410" rx="4" fill="#dbe5f7" stroke="#6b83b8"/>
<text x="900.0" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Progressive decoder (stride 4)</text>
<rect x="791" y="140" width="64" height="335" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
<text x="808.0" y="240.5" transform="rotate(90 808.0 240.5)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">↑2× · + layer 3 skip</text>
<text x="822.0" y="240.5" transform="rotate(90 822.0 240.5)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">2× deform conv + GN + GELU</text>
<text x="833.0" y="381.2" transform="rotate(90 833.0 381.2)" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">128 ch · 128×128</text>
<rect x="868" y="140" width="64" height="335" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
<text x="885.0" y="240.5" transform="rotate(90 885.0 240.5)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">↑2× · + layer 2 skip</text>
<text x="899.0" y="240.5" transform="rotate(90 899.0 240.5)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">2× deform conv + GN + GELU</text>
<text x="910.0" y="381.2" transform="rotate(90 910.0 381.2)" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">64 ch · 256×256</text>
<rect x="945" y="140" width="64" height="335" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
<text x="962.0" y="240.5" transform="rotate(90 962.0 240.5)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">refine (no ↑) · + layer 1 skip</text>
<text x="976.0" y="240.5" transform="rotate(90 976.0 240.5)" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#222">2× deform conv + GN + GELU</text>
<text x="987.0" y="381.2" transform="rotate(90 987.0 381.2)" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">32 ch · 256×256</text>
<text x="900.0" y="495" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">1.6M params incl. head</text>
<path d="M1024,240 H1054" fill="none" stroke="currentColor" marker-end="url(#arr)"/>

<!-- head -->
<rect x="1056" y="95" width="70" height="410" rx="4" fill="#f8d66d" stroke="#b39a2c"/>
<text x="1082.0" y="300" transform="rotate(90 1082.0 300)" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Classification head → 19 classes</text>
<text x="1108.0" y="300" transform="rotate(90 1108.0 300)" text-anchor="middle" font-size="11" font-weight="normal" fill="#222">3×3 conv · GN · GELU · 1×1 conv · at 256×256</text>

<!-- head -> output -->
<path d="M1126,240 H1212" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
<text x="1170" y="229" text-anchor="middle" font-size="11" font-weight="normal" fill="currentColor">bilinear ×4</text>
<rect x="1214" y="175" width="130" height="130" rx="4" fill="#dcdcdc" stroke="#777"/>
<rect x="1214" y="175" width="130" height="50" fill="#87a4c4"/>
<rect x="1214" y="225" width="130" height="80" fill="#7a4d8a"/>
<path d="M1214,305 L1344,305 L1302,250 L1256,250 z" fill="#5a3d6a"/>
<rect x="1232" y="235" width="34" height="34" fill="#2a3f8a"/>
<text x="1279" y="332" text-anchor="middle" font-size="13" font-weight="normal" fill="currentColor">Output segmentation</text>
<text x="1279" y="348" text-anchor="middle" font-size="11.5" font-weight="normal" fill="currentColor">1024×1024×19</text>

<!-- skip connections: from the ResNet box edge under each layer to the decoder box edge under each block -->
<path d="M418,505 V525 H823 V507" fill="none" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M338,505 V545 H900 V507" fill="none" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M258,505 V565 H977 V507" fill="none" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="600" y="587" text-anchor="middle" font-size="11" font-weight="normal" fill="currentColor">skip connections: layer 3 → block 1, layer 2 → block 2, layer 1 → block 3 (each reduced to ¼ channels by 1×1 conv + GN + GELU, then concatenated)</text>
</g>
</svg>
